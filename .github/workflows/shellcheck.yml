name: Repository checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck

      - name: Test public-safe system output
        run: bash scripts/test-system-info-safety.sh

      - name: Check repository-relative Markdown links
        run: python3 scripts/check-markdown-links.py
